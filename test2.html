<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎您的到来</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #dff3ff;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .card {
      background: #ffffff;
      padding: 40px 56px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .card h1 {
      color: #1f2a44;
      font-size: 28px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>欢迎您的到来，谢谢合作！</h1>
  </div>
</body>
</html>
